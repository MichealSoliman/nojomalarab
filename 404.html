<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | نجوم العرب لنقل العفش بجدة</title>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .error-page {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 50px 40px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* شريط علوي بلون الموقع (ذهبي/برتقالي) */
        .error-page::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, #02213f, #02213f, #02213f);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }

        /* أيقونة الخطأ */
        .error-icon {
            font-size: 80px;
            color: #02213f;
            margin-bottom: 20px;
            display: inline-block;
            background: rgba(245, 166, 35, 0.08);
            width: 130px;
            height: 130px;
            line-height: 130px;
            border-radius: 50%;
            transition: transform 0.4s ease, box-shadow 0.3s ease;
        }
        .error-icon img{
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .error-icon i {
            line-height: 130px;
        }

        .error-icon:hover {
            transform: scale(1.05) rotate(-4deg);
            box-shadow: 0 15px 30px rgba(245, 166, 35, 0.15);
        }

        /* العناوين والنصوص */
        .error-title {
            font-size: 40px;
            font-weight: 800;
            color: #1a2a3a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .error-title span {
            color: #02213f;
            background: linear-gradient(145deg, #02213f, #02213f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-subtitle {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 18px;
            color: #5a6b7c;
            line-height: 1.8;
            margin-bottom: 30px;
            padding: 0 10px;
            font-weight: 400;
        }

        .error-message i {
            color: #02213f;
            margin: 0 4px;
        }

        /* روابط المساعدة السريعة */
        .help-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 18px;
            margin-bottom: 35px;
            padding: 0 5px;
        }

        .help-links a {
            color: #1a2a3a;
            text-decoration: none;
            font-weight: 500;
            font-size: 17px;
            padding: 6px 16px;
            border-radius: 40px;
            background: #f1f3f5;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .help-links a i {
            color: #02213f;
            font-size: 15px;
            transition: transform 0.2s ease;
        }

        .help-links a:hover {
            background: #fff8ec;
            border-color: #02213f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 166, 35, 0.10);
        }

        .help-links a:hover i {
            transform: translateX(-4px);
        }

        /* أزرار رئيسية */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            font-family: 'Tajawal', sans-serif;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            min-width: 180px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(145deg, #02213f, #02213f);
            color: white;
            box-shadow: 0 8px 25px rgba(245, 166, 35, 0.25);
            
        }

        .btn-primary i {
            color: #1a2a3a;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(245, 166, 35, 0.35);
            background: linear-gradient(145deg, #fbb52e, #e89c1a);
        }

        .btn-secondary {
            background: #eef2f6;
            color: #1a2a3a;
            border: 2px solid #dce1e8;
        }

        .btn-secondary i {
            color: #02213f;
        }

        .btn-secondary:hover {
            background: #ffffff;
            border-color: #02213f;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
        }

        /* معلومات التواصل */
        .contact-info {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px 25px;
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 18px 35px;
            border: 1px solid #eef2f6;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2c3e50;
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-item i {
            color: #02213f;
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .contact-item:hover {
            color: #02213f;
        }

        .contact-item .phone {
            direction: ltr;
            unicode-bidi: plaintext;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 1px;
            height: 30px;
            background: #dce1e8;
            display: inline-block;
        }

        /* تذييل بسيط */
        .footer-note {
            margin-top: 30px;
            font-size: 14px;
            color: #8a9aa8;
            border-top: 1px solid #eef2f6;
            padding-top: 25px;
        }

        .footer-note a {
            color: #02213f;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        /* استجابة للأجهزة الصغيرة */
        @media (max-width: 600px) {
            .error-page {
                padding: 35px 20px;
            }

            .error-title {
                font-size: 32px;
            }

            .error-subtitle {
                font-size: 19px;
            }

            .error-message {
                font-size: 16px;
                padding: 0 5px;
            }

            .btn {
                padding: 14px 22px;
                font-size: 16px;
                min-width: 150px;
            }

            .help-links a {
                font-size: 15px;
                padding: 5px 14px;
            }

            .contact-info {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
                padding: 18px;
            }

            .divider {
                width: 100%;
                height: 1px;
                background: #dce1e8;
            }

            .contact-item {
                font-size: 16px;
                width: 100%;
                justify-content: flex-start;
            }

            .error-icon {
                width: 100px;
                height: 100px;
                line-height: 100px;
                font-size: 60px;
            }

            .error-icon i {
                line-height: 100px;
            }
        }

        /* تحسين إضافي للوضوح */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

</body>
